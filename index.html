<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0d1020"/><meta http-equiv="Cache-Control" content="no-cache"/>
<title>BloomLoop</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f4ff;background:#0d1020;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer}
#center-guide{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);border:1px solid #ffffff70;border-radius:50%;pointer-events:none;z-index:1;box-shadow:0 0 0 3px #0d102044,0 0 12px #79d9f255;opacity:.75}#center-guide::before,#center-guide::after{content:"";position:absolute;background:#ffffffa0;left:50%;top:50%;transform:translate(-50%,-50%)}#center-guide::before{width:1px;height:34px}#center-guide::after{width:34px;height:1px}#center-guide i{position:absolute;width:4px;height:4px;border-radius:50%;background:#b7f1f5;left:50%;top:50%;transform:translate(-50%,-50%)}
#art{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at center,#19203d 0%,#0d1020 70%)}
header{z-index:3;position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
header>*{pointer-events:auto}h1{font-size:18px;letter-spacing:.035em;margin:0}small{font-size:11px;color:#b0afd0;display:block;margin-top:3px}
.toolbar{z-index:3;position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:8px;right:8px;max-width:760px;margin:auto;background:#1b2033eF;border:1px solid #ffffff24;border-radius:18px;padding:6px;box-shadow:0 10px 26px #0007;backdrop-filter:blur(18px)}
.dock{display:flex;align-items:center;gap:6px;min-height:42px}.dock>button{flex:0 0 auto;min-width:40px}.dock #palette{flex:1;justify-content:center;gap:clamp(4px,1.6vw,12px)}.dock .dot{width:clamp(19px,5vw,25px);height:clamp(19px,5vw,25px);min-width:19px;min-height:19px}.toolbar .extra{padding:12px 6px 4px;border-bottom:1px solid #ffffff24;margin-bottom:7px}.toolbar .extra[hidden]{display:none!important}
.controls,.actions{display:flex;align-items:center;gap:9px}.controls{margin-bottom:12px}.actions{justify-content:space-between;flex-wrap:wrap}
button{border:1px solid #ffffff26;background:#2b324b;color:inherit;border-radius:12px;padding:10px 12px;min-height:42px}
button:active{transform:scale(.96)}button:disabled{opacity:.35}button.primary{background:linear-gradient(120deg,#bd81ed,#6bc8ee);color:#121328;border:0;font-weight:700}
label{display:flex;align-items:center;gap:8px;font-size:12px;color:#d8d8ea}input[type=range]{min-width:0;flex:1;accent-color:#b588f2}
#count{font-variant-numeric:tabular-nums;color:#f9d08b;width:21px}
.dot{width:24px;height:24px;border:2px solid transparent;border-radius:50%;padding:0;min-height:24px;flex-shrink:0}
.dot.selected{border-color:white;outline:2px solid #ffffff66;outline-offset:2px}
#palette{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#313951;border-radius:99px;padding:9px 15px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px;white-space:nowrap}
#toast.show{opacity:1}

.topbar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:11px}.topbar span{font-size:12px;color:#bfc6e2}.extra{display:block}.modes{display:flex;gap:6px;margin-bottom:10px}.modes button{flex:1;font-size:12px;padding:8px 5px}.modes button.chosen,#pan.chosen,[data-tool].chosen{border-color:#b995fa;background:#51416d}
.view{display:flex;gap:6px;align-items:center}.view button{padding:7px 10px;min-height:36px}.view output{font-size:12px;min-width:40px;text-align:center}
#center-guide{margin-left:var(--pan-x,0px);margin-top:var(--pan-y,0px);scale:var(--zoom,1)}
#guides[aria-pressed="true"]{border-color:#b995fa;background:#51416d}



/* Always-visible edge controls. No nested tool panels. */
.rail{position:fixed!important;z-index:100!important;top:100px!important;bottom:76px!important;transform:none!important;visibility:visible!important;opacity:1!important;display:flex!important;flex-direction:column;justify-content:center;gap:5px;padding:6px;background:#1b2033d9;border:1px solid #ffffff24;border-radius:16px;backdrop-filter:blur(12px);max-height:none;overflow-y:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.rail-left{left:5px;right:auto}.rail-right{right:5px;left:auto}
.rail button{width:48px;min-height:43px;padding:5px 2px;font-size:22px;line-height:1;border-radius:10px}.rail button small{font-size:9px;line-height:1.2;color:#e4dff5;margin-top:4px}.rail button.chosen{background:#51416d;border-color:#b995fa}
.rail .vertical-setting{display:flex;flex-direction:column;gap:3px;font-size:10px;text-align:center;width:48px;color:#ece7ff}.rail .vertical-setting strong{font-size:13px;color:#ffdf9e}.rail .vertical-setting input{width:46px;flex:none;accent-color:#bd9efa}
.toolbar{left:5px;right:5px;bottom:calc(env(safe-area-inset-bottom) + 5px);padding:4px 6px;max-width:900px;border-radius:14px}.dock{gap:4px;min-height:40px;justify-content:space-between}.dock>button{padding:6px;min-width:34px;min-height:38px;font-size:15px}.dock #palette{gap:clamp(3px,.9vw,8px)}.dock .dot{width:clamp(18px,4vw,25px);height:clamp(18px,4vw,25px);min-width:18px;min-height:18px}.dock output{font-size:11px;min-width:34px;text-align:center}
@media(max-width:390px){.rail button{width:39px;min-height:39px;font-size:19px}.rail .vertical-setting,.rail .vertical-setting input{width:39px}.dock>button{min-width:29px;padding:5px 3px;font-size:13px}.dock{gap:2px}.dock .dot{min-width:17px;width:17px;height:17px}.dock output{min-width:30px;font-size:10px}}

.rail .step-control{display:flex;flex-direction:column;align-items:center;gap:2px;width:48px;padding:4px 0;border-top:1px solid #ffffff24}.step-control span{font-size:10px;color:#e9e4f6}.rail .step-control button{width:42px;min-height:32px;font-size:20px;font-weight:600;padding:2px 0}.step-control output{font-size:14px;font-weight:700;color:#ffdf9e;min-height:18px;font-variant-numeric:tabular-nums}@media(max-width:390px){.rail .step-control{width:39px}.rail .step-control button{width:35px;min-height:30px}}
.rail [aria-pressed="true"]{background:#51416d;border-color:#b995fa}

#color-panel{position:fixed;z-index:12;bottom:calc(env(safe-area-inset-bottom) + 68px);left:50%;transform:translateX(-50%);width:min(330px,calc(100vw - 20px));background:#232943f7;border:1px solid #9a91c055;padding:14px;border-radius:18px;box-shadow:0 12px 30px #0009}#color-panel[hidden]{display:none}.color-heading{display:flex;justify-content:space-between;align-items:center}.color-heading button{min-height:32px;padding:3px 10px}.color-picker{display:flex;align-items:center;gap:12px;margin:10px 0}.color-picker input{width:72px;height:48px;border:0;background:transparent}.palette-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.palette-choices button{min-height:38px;font-size:12px;padding:6px}
#evolution-controls{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 74px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#1b2033e8;border:1px solid #ffffff24;border-radius:14px;padding:4px}#evolution-controls button{padding:5px 8px;min-height:34px;font-size:12px}#evolution-controls [aria-pressed="true"]{background:#51416d;border-color:#b995fa}
@media(max-width:390px){#evolution-controls{top:calc(env(safe-area-inset-top) + 66px)}#evolution-controls button{padding:5px 6px}}
#color-panel{width:min(350px,calc(100vw - 20px))}.wheel-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin:9px 0 13px}.wheel-wrap{position:relative;width:min(252px,70vw);aspect-ratio:1}.wheel-wrap canvas{display:block;width:100%;height:100%;border-radius:50%;touch-action:none;cursor:crosshair}.wheel-wrap #wheel-cursor{position:absolute;pointer-events:none;left:50%;top:50%;width:17px;height:17px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #172036,0 1px 5px #000b}.picked{display:flex;align-items:center;gap:9px;font-size:13px}.picked span{height:25px;width:34px;border:1px solid #ffffff88;border-radius:7px;background:#77dceb}
</style>
</head>
<body>
<canvas id="art" aria-label="Symmetrical drawing area"></canvas>
<div id="center-guide" aria-hidden="true"><i></i></div>
<header><div><h1>✿ BloomLoop</h1><small>Draw something beautiful. · v0.5.2</small></div><button id="save" class="primary">Save PNG</button></header>
<div id="toast" role="status"></div>
<aside class="rail rail-left" aria-label="Drawing tools">
 <button data-tool="free" class="chosen" title="Smooth brush">✎<small>Smooth</small></button>
 <button data-tool="line" title="Straight line">╱<small>Line</small></button>
 <button data-tool="circle" title="Circle">◯<small>Circle</small></button>
 <button data-tool="arc" title="Arc">⌒<small>Arc</small></button>
 <button id="precision" aria-pressed="false" title="Toggle shape snapping">◇<small>Snap off</small></button>
 <button id="circle-assist" aria-pressed="false" title="Correct rough circles drawn with Smooth">◎<small>Auto circle</small></button>
 <button id="pan" aria-pressed="false" title="Pan canvas">✥<small>Pan</small></button>
</aside>
<aside class="rail rail-right" aria-label="Brush and canvas settings">
 <button data-style="ink" class="chosen" title="Classic Ink">✧<small>Ink</small></button>
 <button data-style="glow" title="Soft Glow">✦<small>Glow</small></button>
 <button data-style="dream" title="Dream">☁<small>Dream</small></button>
 <div class="step-control" role="group" aria-label="Slice count"><span>Slices</span><button id="slices-up" aria-label="Increase slices">+</button><output id="count" aria-live="off">12</output><button id="slices-down" aria-label="Decrease slices">−</button><input id="symmetry" type="hidden" value="12"/></div>
 <div class="step-control" role="group" aria-label="Brush size"><span>Size</span><button id="size-up" aria-label="Increase brush size">+</button><output id="size-count" aria-live="off">3</output><button id="size-down" aria-label="Decrease brush size">−</button><input id="brush" type="hidden" value="3"/></div>
 <div class="step-control" role="group" aria-label="Curve smoothing"><span>Smooth</span><button id="smooth-up" aria-label="Increase curve smoothing">+</button><output id="smooth-count">2</output><button id="smooth-down" aria-label="Decrease curve smoothing">−</button></div>
 <button id="guides" aria-pressed="true" title="Toggle slice guides">☷<small>Guides</small></button>
</aside>
<div class="toolbar" aria-label="Colors and canvas actions">
 <div class="dock">
  <button id="undo" title="Undo" aria-label="Undo">↶</button>
  <button id="redo" title="Redo" aria-label="Redo">↷</button>
  <div id="palette" aria-label="Brush colors"></div><button id="colors-open" title="Color wheel and palettes" aria-expanded="false">🎨</button>
  <button id="minus" aria-label="Zoom out">−</button>
  <output id="zoom-label">100%</output>
  <button id="plus" aria-label="Zoom in">+</button>
  <button id="fit" title="Reset view">⌂</button>
  <button id="clear">Clear</button>
 </div>
</div>
<section id="color-panel" hidden aria-label="Color picker and palettes">
 <div class="color-heading"><strong>Colors</strong><button id="colors-close" aria-label="Close colors">×</button></div>
 <div class="wheel-area"><div class="wheel-wrap"><canvas id="color-wheel" width="256" height="256" aria-label="Rainbow color wheel, tap or drag to select color"></canvas><div id="wheel-cursor" aria-hidden="true"></div></div><div class="picked"><span id="picked-swatch"></span><strong id="picked-hex">#77DCEB</strong></div></div>
 <div class="palette-choices"><button data-palette="aurora">Aurora</button><button data-palette="sunset">Sunset</button><button data-palette="ocean">Ocean</button><button data-palette="garden">Garden</button><button data-palette="mono">Moonlight</button></div>
</section>
<div id="evolution-controls" aria-label="Live Evolution controls">
 <button id="evolve" aria-pressed="false">▶ Evolve</button>
 <button id="spin" aria-pressed="true" title="Rotation">↻</button>
 <button id="breathe" aria-pressed="true" title="Breathing">◉</button>
 <button id="sparkle" aria-pressed="false" title="Sparkles">✦</button>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const symmetry=document.getElementById('symmetry'),count=document.getElementById('count'),brush=document.getElementById('brush');
const palettes={aurora:['#77dceb','#c8a0ff','#fa91bf','#ffd28d','#b4f2bc','#ffffff'],sunset:['#ff646c','#ff9d5c','#ffd166','#e273b1','#a37cf5','#fff0c5'],ocean:['#1d80af','#47c6d7','#8be5ed','#225b9f','#87b4fb','#d7faff'],garden:['#4fac76','#b6e47b','#ffc98c','#f38bad','#9166c4','#ecf5cf'],mono:['#ffffff','#c8d1e4','#9faec9','#7789ac','#52627f','#e6ecff']};let colors=palettes.aurora.slice();
let showGuides=true,snapEnabled=false,circleAssist=false,smoothLevel=2;
let activeColor=colors[0],strokes=[],redo=[],current=null,w=0,h=0,dpr=1,activePointer=null,noticeTimer,style='ink',zoom=1,panX=0,panY=0,panMode=false,lastDrag=null,tool='free',framePending=false,cacheValid=false,evolving=false,evolveTime=0,lastEvolve=0,rotateOn=true,breatheOn=true,sparkleOn=false,evolveRAF=0;
const key='bloomloop-v01';
const layer=document.createElement('canvas'),layerCtx=layer.getContext('2d');
let layerSide=0,layerOriginX=0,layerOriginY=0;
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function buttons(){document.getElementById('undo').disabled=strokes.length===0;document.getElementById('redo').disabled=redo.length===0}
function resize(){const oldW=w,oldH=h;w=window.innerWidth;h=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layerSide=Math.ceil(Math.hypot(w,h)*dpr);layer.width=layerSide;layer.height=layerSide;layerOriginX=(layerSide/dpr-w)/2;layerOriginY=(layerSide/dpr-h)/2;cacheValid=false;render()}
function point(e){const size=Math.min(w,h)*.44*zoom;return{x:(e.clientX-w/2-panX)/size,y:(e.clientY-h/2-panY)/size}}
function pathSegment(c,a,b,scale){c.beginPath();c.moveTo(a.x*scale,a.y*scale);c.lineTo(b.x*scale,b.y*scale);c.stroke()}
function preparedPoints(s){const raw=s.points;if((s.tool||'free')!=='free'||raw.length<3)return raw;const level=Math.max(0,Math.min(5,s.smoothing??0));if(!level)return raw;const radius=Math.min(6,level+1),out=[];for(let i=0;i<raw.length;i++){if(i===0||i===raw.length-1){out.push(raw[i]);continue}let sx=0,sy=0,weight=0;for(let j=Math.max(0,i-radius);j<=Math.min(raw.length-1,i+radius);j++){const wt=radius+1-Math.abs(i-j);sx+=raw[j].x*wt;sy+=raw[j].y*wt;weight+=wt}out.push({x:sx/weight,y:sy/weight})}return out}
function nearCircle(points){if(points.length<14)return null;const first=points[0],last=points[points.length-1];let length=0,minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(let i=0;i<points.length;i++){const p=points[i];minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);if(i)length+=Math.hypot(p.x-points[i-1].x,p.y-points[i-1].y)}const width=maxX-minX,height=maxY-minY,r=(width+height)/4;if(r<.045||Math.abs(width-height)/Math.max(width,height)>.27||Math.hypot(first.x-last.x,first.y-last.y)>r*.55||length<4.3*r||length>8.4*r)return null;const cx=(minX+maxX)/2,cy=(minY+maxY)/2;let variance=0;for(const p of points){variance+=Math.pow(Math.hypot(p.x-cx,p.y-cy)-r,2)}if(Math.sqrt(variance/points.length)>r*.25)return null;return {x:cx,y:cy,r}}
function tracePath(c,s,scale){
 const pts=preparedPoints(s);if(!pts.length)return;const a=pts[0],b=pts[pts.length-1],type=s.tool||'free';
 c.beginPath();
 if(s.assistedCircle){const q=s.assistedCircle;c.arc(q.x*scale,q.y*scale,q.r*scale,0,Math.PI*2);return}
 if(type==='circle'&&pts.length>1){const r=Math.hypot(b.x-a.x,b.y-a.y)*scale;c.arc(a.x*scale,a.y*scale,r,0,Math.PI*2);return}
 if(type==='arc'&&pts.length>1){const dx=b.x-a.x,dy=b.y-a.y,r=Math.hypot(dx,dy)*scale/2;if(r<.01)return;const cx=(a.x+b.x)*scale/2,cy=(a.y+b.y)*scale/2,ang=Math.atan2(dy,dx);c.arc(cx,cy,r,ang+Math.PI,ang,false);return}
 c.moveTo(a.x*scale,a.y*scale);
 if(type==='line'){let end=b;if(s.snap){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),step=Math.PI/12;const angle=Math.round(Math.atan2(dy,dx)/step)*step;end={x:a.x+len*Math.cos(angle),y:a.y+len*Math.sin(angle)}}c.lineTo(end.x*scale,end.y*scale);return}
 if(pts.length===1){c.lineTo(a.x*scale+.001,a.y*scale);return}
 // Quadratic midpoint interpolation reduces touch-input corners.
 for(let j=1;j<pts.length-1;j++){const p=pts[j],q=pts[j+1];c.quadraticCurveTo(p.x*scale,p.y*scale,(p.x+q.x)*scale/2,(p.y+q.y)*scale/2)}
 const last=pts[pts.length-1];c.lineTo(last.x*scale,last.y*scale);
}
function paintStroke(c,s,width,height,preview=false){if(!s.points.length)return;const scale=Math.min(width,height)*.44;c.save();c.translate(width/2,height/2);c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.brush*(Math.min(width,height)/390);if(s.style==='dream'){c.globalAlpha=.38;c.lineWidth*=2.3}c.lineCap='round';c.lineJoin='round';
 // Several translucent passes avoid expensive shadowBlur for each mirrored path.
 const baseWidth=c.lineWidth,glow=s.style==='glow';
 if(glow&&!preview){c.shadowColor=s.color;c.shadowBlur=Math.max(6,baseWidth*4);}
 for(let i=0;i<s.symmetry;i++){c.save();c.rotate(2*Math.PI*i/s.symmetry);for(const mirrored of [false,true]){c.save();if(mirrored)c.scale(1,-1);tracePath(c,s,scale);
 if(glow&&preview){c.globalAlpha=.12;c.lineWidth=baseWidth*3.5;c.stroke();c.globalAlpha=1;c.lineWidth=baseWidth;c.stroke()}
 else if(glow){c.globalAlpha=.8;c.lineWidth=baseWidth;c.stroke();c.shadowBlur=0;c.globalAlpha=1;c.stroke();c.shadowBlur=Math.max(6,baseWidth*4)}
 else c.stroke();
 c.restore()}c.restore()}c.restore()}
function paintCached(){layerCtx.setTransform(1,0,0,1,0,0);layerCtx.clearRect(0,0,layer.width,layer.height);layerCtx.setTransform(dpr,0,0,dpr,0,0);layerCtx.translate(layerOriginX,layerOriginY);for(const s of strokes)paintStroke(layerCtx,s,w,h);cacheValid=true}
function drawGuides(){if(!showGuides)return;const n=Number(symmetry.value);const radius=Math.hypot(w,h)/Math.max(.25,zoom);ctx.save();ctx.translate(w/2+panX,h/2+panY);ctx.scale(zoom,zoom);ctx.strokeStyle='rgba(200,215,255,.19)';ctx.lineWidth=1/zoom;ctx.setLineDash([5/zoom,8/zoom]);for(let i=0;i<n;i++){const a=i*Math.PI*2/n;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*radius,Math.sin(a)*radius);ctx.stroke()}ctx.restore()}
function drawFrame(){framePending=false;if(!cacheValid)paintCached();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2+panX,h/2+panY);ctx.scale(zoom,zoom);if(evolving){if(rotateOn)ctx.rotate(evolveTime*.08);if(breatheOn){const pulse=1+.035*Math.sin(evolveTime*1.7);ctx.scale(pulse,pulse)}}ctx.translate(-w/2,-h/2);ctx.drawImage(layer,-layerOriginX,-layerOriginY,layerSide/dpr,layerSide/dpr);if(current)paintStroke(ctx,current,w,h,true);ctx.restore();if(evolving&&sparkleOn)drawSparkles();drawGuides()}
function drawSparkles(){if(!strokes.length)return;const max=Math.min(25,strokes.length*2);ctx.save();ctx.fillStyle='#fff8cc';for(let i=0;i<max;i++){const stroke=strokes[i%strokes.length];if(!stroke.points.length)continue;const p=stroke.points[(Math.floor(evolveTime*4+i*17))%stroke.points.length];const a=2*Math.PI*((i*7)%stroke.symmetry)/stroke.symmetry;const x=p.x*Math.cos(a)-p.y*Math.sin(a),y=p.x*Math.sin(a)+p.y*Math.cos(a);const scale=Math.min(w,h)*.44*zoom;const size=1+1.3*(1+Math.sin(evolveTime*3+i));ctx.globalAlpha=.35+.45*(.5+.5*Math.sin(evolveTime*3+i));ctx.beginPath();ctx.arc(w/2+panX+x*scale,h/2+panY+y*scale,size,0,Math.PI*2);ctx.fill()}ctx.restore()}
function evolveFrame(t){if(!evolving)return;if(lastEvolve)evolveTime+=Math.min(.05,(t-lastEvolve)/1000);lastEvolve=t;render();evolveRAF=requestAnimationFrame(evolveFrame)}
function render(){if(!framePending){framePending=true;requestAnimationFrame(drawFrame)}const guide=document.getElementById('center-guide');guide.style.setProperty('--pan-x',panX+'px');guide.style.setProperty('--pan-y',panY+'px');guide.style.setProperty('--zoom',zoom);document.getElementById('zoom-label').textContent=Math.round(zoom*100)+'%'}
function persist(){try{localStorage.setItem(key,JSON.stringify(strokes))}catch(e){toast('Storage full. Export your artwork.')}}
function finish(){if(!current)return;if(current.tool==='free'&&current.assist){const fit=nearCircle(current.points);if(fit)current.assistedCircle=fit}const finished=current;strokes.push(finished);current=null;redo=[];if(cacheValid){layerCtx.setTransform(dpr,0,0,dpr,0,0);layerCtx.translate(layerOriginX,layerOriginY);paintStroke(layerCtx,finished,w,h)}else{cacheValid=false}persist();buttons();render()}
canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);if(panMode){lastDrag={x:e.clientX,y:e.clientY};return}current={color:activeColor,brush:Number(brush.value),symmetry:Number(symmetry.value),style,tool,smoothing:smoothLevel,snap:snapEnabled,assist:circleAssist,points:[point(e)]};render()});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer)return;e.preventDefault();if(lastDrag){panX+=e.clientX-lastDrag.x;panY+=e.clientY-lastDrag.y;lastDrag={x:e.clientX,y:e.clientY};render();return}if(!current)return;const p=point(e),last=current.points[current.points.length-1];if(tool!=='free'){current.points[1]=p;render()}else if(Math.hypot(p.x-last.x,p.y-last.y)>.004){current.points.push(p);render()}});
function endPointer(e){if(e.pointerId!==activePointer)return;activePointer=null;lastDrag=null;finish()}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);window.addEventListener('blur',()=>{activePointer=null;lastDrag=null;finish()});
function changeStep(input,output,delta,min,max){const value=Math.max(min,Math.min(max,Number(input.value)+delta));input.value=String(value);output.textContent=String(value);if(input===symmetry)render()}
document.getElementById('slices-up').onclick=()=>changeStep(symmetry,count,1,2,48);
document.getElementById('slices-down').onclick=()=>changeStep(symmetry,count,-1,2,48);
document.getElementById('size-up').onclick=()=>changeStep(brush,document.getElementById('size-count'),1,1,18);
document.getElementById('size-down').onclick=()=>changeStep(brush,document.getElementById('size-count'),-1,1,18);
function smoothingStep(delta){smoothLevel=Math.max(0,Math.min(5,smoothLevel+delta));document.getElementById('smooth-count').textContent=String(smoothLevel)}
document.getElementById('smooth-up').onclick=()=>smoothingStep(1);
document.getElementById('smooth-down').onclick=()=>smoothingStep(-1);
document.getElementById('precision').onclick=()=>{snapEnabled=!snapEnabled;const b=document.getElementById('precision');b.setAttribute('aria-pressed',String(snapEnabled));b.innerHTML=snapEnabled?'◇<small>Snap on</small>':'◇<small>Snap off</small>';b.classList.toggle('chosen',snapEnabled)};
document.getElementById('circle-assist').onclick=()=>{circleAssist=!circleAssist;const b=document.getElementById('circle-assist');b.setAttribute('aria-pressed',String(circleAssist));b.classList.toggle('chosen',circleAssist);toast(circleAssist?'Auto circle on':'Auto circle off')};
document.getElementById('guides').onclick=()=>{showGuides=!showGuides;const b=document.getElementById('guides');b.setAttribute('aria-pressed',String(showGuides));b.innerHTML=showGuides?'☷<small>Guides</small>':'☰<small>Guides</small>';render()};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('chosen',x===b));toast(b.textContent+' tool')});
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('chosen',x===b));toast(b.textContent+' brush')});
document.getElementById('pan').onclick=()=>{panMode=!panMode;document.getElementById('pan').classList.toggle('chosen',panMode);document.getElementById('pan').setAttribute('aria-pressed',String(panMode));toast(panMode?'Drag to move artwork':'Drawing mode')};
document.getElementById('plus').onclick=()=>{zoom=Math.min(4,Math.round((zoom+.25)*100)/100);render()};
document.getElementById('minus').onclick=()=>{zoom=Math.max(.25,Math.round((zoom-.25)*100)/100);render()};
document.getElementById('fit').onclick=()=>{zoom=1;panX=0;panY=0;render()};

document.getElementById('undo').onclick=()=>{if(strokes.length){redo.push(strokes.pop());cacheValid=false;persist();render();buttons()}};
document.getElementById('redo').onclick=()=>{if(redo.length){strokes.push(redo.pop());cacheValid=false;persist();render();buttons()}};
document.getElementById('clear').onclick=()=>{if(!strokes.length)return;if(!confirm('Clear your drawing?'))return;strokes=[];redo=[];current=null;cacheValid=false;persist();render();buttons();toast('Canvas cleared')};
document.getElementById('save').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=2048;const c=out.getContext('2d');c.fillStyle='#0d1020';c.fillRect(0,0,2048,2048);for(const stroke of strokes)paintStroke(c,stroke,2048,2048);if(current)paintStroke(c,current,2048,2048);const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='bloomloop-'+new Date().toISOString().slice(0,10)+'.png';a.click();toast('Artwork exported')};
const palette=document.getElementById('palette');
function selectColor(color){activeColor=color;document.getElementById('picked-swatch').style.background=color;document.getElementById('picked-hex').textContent=color.toUpperCase();palette.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.color===color))}
function showPalette(){palette.innerHTML='';colors.forEach(color=>{const b=document.createElement('button');b.className='dot';b.style.background=color;b.dataset.color=color;b.type='button';b.setAttribute('aria-label','Select '+color);b.onclick=()=>selectColor(color);palette.appendChild(b)});selectColor(colors.includes(activeColor)?activeColor:colors[0])}
showPalette();
const wheel=document.getElementById('color-wheel'),wheelCtx=wheel.getContext('2d'),cursor=document.getElementById('wheel-cursor');
function hsvColor(h,s){const a=h*6,i=Math.floor(a),f=a-i,p=1-s,q=1-f*s,t=1-(1-f)*s;const parts=[[1,t,p],[q,1,p],[p,1,t],[p,q,1],[t,p,1],[1,p,q]][Math.min(5,i)];return '#'+parts.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')}
function drawColorWheel(){const size=wheel.width,r=size/2,pixels=wheelCtx.createImageData(size,size);for(let y=0;y<size;y++)for(let x=0;x<size;x++){const dx=x-r+.5,dy=y-r+.5,dist=Math.hypot(dx,dy),idx=(y*size+x)*4;if(dist>r-1){pixels.data[idx+3]=0;continue}const color=hsvColor((Math.atan2(dy,dx)/(2*Math.PI)+1)%1,Math.min(1,dist/(r-1)));pixels.data[idx]=parseInt(color.slice(1,3),16);pixels.data[idx+1]=parseInt(color.slice(3,5),16);pixels.data[idx+2]=parseInt(color.slice(5,7),16);pixels.data[idx+3]=255}wheelCtx.putImageData(pixels,0,0)}
function pickWheel(e){const box=wheel.getBoundingClientRect(),r=box.width/2,dx=e.clientX-box.left-r,dy=e.clientY-box.top-r,dist=Math.hypot(dx,dy),ratio=dist>r? r/dist:1;const x=dx*ratio,y=dy*ratio;const color=hsvColor((Math.atan2(y,x)/(2*Math.PI)+1)%1,Math.min(1,Math.hypot(x,y)/r));selectColor(color);cursor.style.left=(50+x/box.width*100)+'%';cursor.style.top=(50+y/box.height*100)+'%'}
wheel.addEventListener('pointerdown',e=>{e.preventDefault();wheel.setPointerCapture(e.pointerId);pickWheel(e)});
wheel.addEventListener('pointermove',e=>{if(e.buttons)pickWheel(e)});
drawColorWheel();
document.getElementById('colors-open').onclick=()=>{const p=document.getElementById('color-panel');p.hidden=!p.hidden;document.getElementById('colors-open').setAttribute('aria-expanded',String(!p.hidden))};
document.getElementById('colors-close').onclick=()=>{document.getElementById('color-panel').hidden=true;document.getElementById('colors-open').setAttribute('aria-expanded','false')};
document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{colors=palettes[b.dataset.palette].slice();activeColor=colors[0];showPalette();toast(b.textContent+' palette')});
document.getElementById('evolve').onclick=()=>{evolving=!evolving;const b=document.getElementById('evolve');b.setAttribute('aria-pressed',String(evolving));b.textContent=evolving?'❚❚ Pause':'▶ Evolve';if(evolving){lastEvolve=0;evolveRAF=requestAnimationFrame(evolveFrame)}else{cancelAnimationFrame(evolveRAF);render()}};
for(const [id,key] of [['spin','rotate'],['breathe','breathe'],['sparkle','sparkle']]){document.getElementById(id).onclick=()=>{if(key==='rotate')rotateOn=!rotateOn;if(key==='breathe')breatheOn=!breatheOn;if(key==='sparkle')sparkleOn=!sparkleOn;document.getElementById(id).setAttribute('aria-pressed',String(key==='rotate'?rotateOn:key==='breathe'?breatheOn:sparkleOn));render()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&evolving){document.getElementById('evolve').click()}});
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))strokes=saved.filter(s=>s&&Array.isArray(s.points)&&Number.isInteger(s.symmetry)&&s.symmetry>=2&&s.symmetry<=48&&typeof s.color==='string'&&Number.isFinite(s.brush)).slice(-300)}catch(e){toast('Previous sketch could not be loaded')}
window.addEventListener('resize',resize);resize();buttons();
})();
</script>
</body>
</html>

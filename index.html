<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0d1020"/>
<title>BloomLoop</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f4ff;background:#0d1020;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer}
#art{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at center,#19203d 0%,#0d1020 70%)}
header{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
header>*{pointer-events:auto}h1{font-size:18px;letter-spacing:.035em;margin:0}small{font-size:11px;color:#b0afd0;display:block;margin-top:3px}
.toolbar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:12px;right:12px;max-width:580px;margin:auto;background:#1b2033ee;border:1px solid #ffffff24;border-radius:22px;padding:13px;box-shadow:0 15px 50px #0008;backdrop-filter:blur(18px)}
.controls,.actions{display:flex;align-items:center;gap:9px}.controls{margin-bottom:12px}.actions{justify-content:space-between;flex-wrap:wrap}
button{border:1px solid #ffffff26;background:#2b324b;color:inherit;border-radius:12px;padding:10px 12px;min-height:42px}
button:active{transform:scale(.96)}button:disabled{opacity:.35}button.primary{background:linear-gradient(120deg,#bd81ed,#6bc8ee);color:#121328;border:0;font-weight:700}
label{display:flex;align-items:center;gap:8px;font-size:12px;color:#d8d8ea}input[type=range]{min-width:0;flex:1;accent-color:#b588f2}
#count{font-variant-numeric:tabular-nums;color:#f9d08b;width:21px}
.dot{width:24px;height:24px;border:2px solid transparent;border-radius:50%;padding:0;min-height:24px;flex-shrink:0}
.dot.selected{border-color:white;outline:2px solid #ffffff66;outline-offset:2px}
#palette{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#313951;border-radius:99px;padding:9px 15px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px;white-space:nowrap}
#toast.show{opacity:1}
@media(max-width:390px){.toolbar{padding:10px}.actions{gap:5px}.actions button{padding:8px 9px;font-size:12px}#palette{gap:7px}}
</style>
</head>
<body>
<canvas id="art" aria-label="Symmetrical drawing area"></canvas>
<header><div><h1>✿ BloomLoop</h1><small>Draw something beautiful.</small></div><button id="save" class="primary">Save PNG</button></header>
<div id="toast" role="status"></div>
<div class="toolbar" aria-label="Drawing controls">
 <div class="controls"><label for="symmetry">Symmetry <strong id="count">12</strong></label><input id="symmetry" type="range" min="2" max="24" step="1" value="12"/><label for="brush">Size</label><input id="brush" type="range" min="1" max="18" value="3" style="max-width:85px"/></div>
 <div class="actions"><div id="palette" aria-label="Brush colors"></div><button id="undo" title="Undo" aria-label="Undo">↶</button><button id="redo" title="Redo" aria-label="Redo">↷</button><button id="clear">Clear</button></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const symmetry=document.getElementById('symmetry'),count=document.getElementById('count'),brush=document.getElementById('brush');
const colors=['#77dceb','#c8a0ff','#fa91bf','#ffd28d','#b4f2bc','#ffffff'];
let activeColor=colors[0],strokes=[],redo=[],current=null,w=0,h=0,dpr=1,activePointer=null,noticeTimer;
const key='bloomloop-v01';
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function buttons(){document.getElementById('undo').disabled=strokes.length===0;document.getElementById('redo').disabled=redo.length===0}
function resize(){const oldW=w,oldH=h;w=window.innerWidth;h=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render()}
function point(e){const size=Math.min(w,h)*.44;return{x:(e.clientX-w/2)/size,y:(e.clientY-h/2)/size}}
function pathSegment(c,a,b,scale){c.beginPath();c.moveTo(a.x*scale,a.y*scale);c.lineTo(b.x*scale,b.y*scale);c.stroke()}
function paintStroke(c,s,width,height){const n=s.symmetry,pts=s.points;if(!pts.length)return;const scale=Math.min(width,height)*.44;c.save();c.translate(width/2,height/2);c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.brush*(Math.min(width,height)/390);c.lineCap='round';c.lineJoin='round';for(let i=0;i<n;i++){c.save();c.rotate(2*Math.PI*i/n);for(const mirror of [false,true]){c.save();if(mirror)c.scale(1,-1);if(pts.length===1){c.beginPath();c.arc(pts[0].x*scale,pts[0].y*scale,c.lineWidth/2,0,Math.PI*2);c.fill()}else{c.beginPath();c.moveTo(pts[0].x*scale,pts[0].y*scale);for(let j=1;j<pts.length;j++)c.lineTo(pts[j].x*scale,pts[j].y*scale);c.stroke()}c.restore()}c.restore()}c.restore()}
function render(){ctx.clearRect(0,0,w,h);for(const stroke of strokes)paintStroke(ctx,stroke,w,h);if(current)paintStroke(ctx,current,w,h)}
function persist(){try{localStorage.setItem(key,JSON.stringify(strokes))}catch(e){toast('Storage full. Export your artwork.')}}
function finish(){if(!current)return;strokes.push(current);current=null;redo=[];persist();buttons();render()}
canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);current={color:activeColor,brush:Number(brush.value),symmetry:Number(symmetry.value),points:[point(e)]};render()});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer||!current)return;e.preventDefault();const p=point(e),last=current.points[current.points.length-1];if(Math.hypot(p.x-last.x,p.y-last.y)>.002){current.points.push(p);render()}});
function endPointer(e){if(e.pointerId!==activePointer)return;activePointer=null;finish()}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);window.addEventListener('blur',()=>{activePointer=null;finish()});
symmetry.addEventListener('input',()=>count.textContent=symmetry.value);
document.getElementById('undo').onclick=()=>{if(strokes.length){redo.push(strokes.pop());persist();render();buttons()}};
document.getElementById('redo').onclick=()=>{if(redo.length){strokes.push(redo.pop());persist();render();buttons()}};
document.getElementById('clear').onclick=()=>{if(!strokes.length)return;if(!confirm('Clear your drawing?'))return;strokes=[];redo=[];current=null;persist();render();buttons();toast('Canvas cleared')};
document.getElementById('save').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=2048;const c=out.getContext('2d');c.fillStyle='#0d1020';c.fillRect(0,0,2048,2048);for(const stroke of strokes)paintStroke(c,stroke,2048,2048);if(current)paintStroke(c,current,2048,2048);const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='bloomloop-'+new Date().toISOString().slice(0,10)+'.png';a.click();toast('Artwork exported')};
const palette=document.getElementById('palette');colors.forEach(color=>{const b=document.createElement('button');b.className='dot';b.style.background=color;b.type='button';b.setAttribute('aria-label','Select '+color);b.onclick=()=>{activeColor=color;palette.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};palette.appendChild(b)});palette.firstChild.classList.add('selected');
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))strokes=saved.filter(s=>s&&Array.isArray(s.points)&&Number.isInteger(s.symmetry)&&s.symmetry>=2&&s.symmetry<=24&&typeof s.color==='string'&&Number.isFinite(s.brush)).slice(-300)}catch(e){toast('Previous sketch could not be loaded')}
window.addEventListener('resize',resize);resize();buttons();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0d1020"/>
<title>BloomLoop</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f4ff;background:#0d1020;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer}
#center-guide{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);border:1px solid #ffffff70;border-radius:50%;pointer-events:none;z-index:1;box-shadow:0 0 0 3px #0d102044,0 0 12px #79d9f255;opacity:.75}#center-guide::before,#center-guide::after{content:"";position:absolute;background:#ffffffa0;left:50%;top:50%;transform:translate(-50%,-50%)}#center-guide::before{width:1px;height:34px}#center-guide::after{width:34px;height:1px}#center-guide i{position:absolute;width:4px;height:4px;border-radius:50%;background:#b7f1f5;left:50%;top:50%;transform:translate(-50%,-50%)}
#art{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at center,#19203d 0%,#0d1020 70%)}
header{z-index:3;position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
header>*{pointer-events:auto}h1{font-size:18px;letter-spacing:.035em;margin:0}small{font-size:11px;color:#b0afd0;display:block;margin-top:3px}
.toolbar{z-index:3;position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:8px;right:8px;max-width:760px;margin:auto;background:#1b2033eF;border:1px solid #ffffff24;border-radius:18px;padding:6px;box-shadow:0 10px 26px #0007;backdrop-filter:blur(18px)}
.dock{display:flex;align-items:center;gap:6px;min-height:42px}.dock>button{flex:0 0 auto;min-width:40px}.dock #palette{flex:1;justify-content:center;gap:clamp(4px,1.6vw,12px)}.dock .dot{width:clamp(19px,5vw,25px);height:clamp(19px,5vw,25px);min-width:19px;min-height:19px}.toolbar .extra{padding:12px 6px 4px;border-bottom:1px solid #ffffff24;margin-bottom:7px}.toolbar .extra[hidden]{display:none!important}
.controls,.actions{display:flex;align-items:center;gap:9px}.controls{margin-bottom:12px}.actions{justify-content:space-between;flex-wrap:wrap}
button{border:1px solid #ffffff26;background:#2b324b;color:inherit;border-radius:12px;padding:10px 12px;min-height:42px}
button:active{transform:scale(.96)}button:disabled{opacity:.35}button.primary{background:linear-gradient(120deg,#bd81ed,#6bc8ee);color:#121328;border:0;font-weight:700}
label{display:flex;align-items:center;gap:8px;font-size:12px;color:#d8d8ea}input[type=range]{min-width:0;flex:1;accent-color:#b588f2}
#count{font-variant-numeric:tabular-nums;color:#f9d08b;width:21px}
.dot{width:24px;height:24px;border:2px solid transparent;border-radius:50%;padding:0;min-height:24px;flex-shrink:0}
.dot.selected{border-color:white;outline:2px solid #ffffff66;outline-offset:2px}
#palette{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#313951;border-radius:99px;padding:9px 15px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px;white-space:nowrap}
#toast.show{opacity:1}

.topbar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:11px}.topbar span{font-size:12px;color:#bfc6e2}.extra{display:block}.modes{display:flex;gap:6px;margin-bottom:10px}.modes button{flex:1;font-size:12px;padding:8px 5px}.modes button.chosen,#pan.chosen,[data-tool].chosen{border-color:#b995fa;background:#51416d}
.view{display:flex;gap:6px;align-items:center}.view button{padding:7px 10px;min-height:36px}.view output{font-size:12px;min-width:40px;text-align:center}
#center-guide{margin-left:var(--pan-x,0px);margin-top:var(--pan-y,0px);scale:var(--zoom,1)}
#guides[aria-pressed="true"]{border-color:#b995fa;background:#51416d}

@media(max-width:390px){.toolbar{padding:5px;left:5px;right:5px}.dock{gap:4px}.dock>button{padding:7px 6px;font-size:12px;min-width:36px}.dock-label{display:none}.dock #palette{gap:4px}.dock .dot{width:20px;height:20px}.modes button{font-size:11px}}.actions{gap:5px}.actions button{padding:8px 9px;font-size:12px}#palette{gap:7px}}
</style>
</head>
<body>
<canvas id="art" aria-label="Symmetrical drawing area"></canvas>
<div id="center-guide" aria-hidden="true"><i></i></div>
<header><div><h1>✿ BloomLoop</h1><small>Draw something beautiful.</small></div><button id="save" class="primary">Save PNG</button></header>
<div id="toast" role="status"></div>
<div class="toolbar" aria-label="Drawing controls">
 <div class="dock">
  <button id="toggle" aria-expanded="false" aria-controls="advanced">⚙ <span class="dock-label">Tools</span></button>
  <button id="undo" title="Undo" aria-label="Undo">↶</button><button id="redo" title="Redo" aria-label="Redo">↷</button>
  <div id="palette" aria-label="Brush colors"></div>
  <button id="pan" aria-pressed="false">Pan</button>
  <button id="clear">Clear</button>
 </div>
 <div class="extra" id="advanced" hidden>
  <div class="modes" role="group" aria-label="Brush style"><button data-style="ink" class="chosen">Classic Ink</button><button data-style="glow">Soft Glow</button><button data-style="dream">Dream</button></div>
  <div class="modes" role="group" aria-label="Drawing tool"><button data-tool="free" class="chosen">Smooth</button><button data-tool="line">Line</button><button data-tool="circle">Circle</button><button data-tool="arc">Arc</button></div>
  <div class="controls"><div class="view"><button id="minus" aria-label="Zoom out">−</button><output id="zoom-label">100%</output><button id="plus" aria-label="Zoom in">+</button><button id="fit">Reset view</button></div></div>
  <div class="controls"><label for="symmetry">Slices <strong id="count">12</strong></label><input id="symmetry" type="range" min="2" max="48" step="1" value="12" aria-label="Number of slices"/><button id="guides" aria-pressed="true" title="Toggle slice guides">Guides ✓</button></div>
  <div class="controls"><label for="brush">Brush size</label><input id="brush" type="range" min="1" max="18" value="3"/></div>
 </div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const symmetry=document.getElementById('symmetry'),count=document.getElementById('count'),brush=document.getElementById('brush');
const colors=['#77dceb','#c8a0ff','#fa91bf','#ffd28d','#b4f2bc','#ffffff'];
let showGuides=true;
let activeColor=colors[0],strokes=[],redo=[],current=null,w=0,h=0,dpr=1,activePointer=null,noticeTimer,style='ink',zoom=1,panX=0,panY=0,panMode=false,lastDrag=null,tool='free',framePending=false,cacheValid=false;
const key='bloomloop-v01';
const layer=document.createElement('canvas'),layerCtx=layer.getContext('2d');
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function buttons(){document.getElementById('undo').disabled=strokes.length===0;document.getElementById('redo').disabled=redo.length===0}
function resize(){const oldW=w,oldH=h;w=window.innerWidth;h=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layer.width=canvas.width;layer.height=canvas.height;cacheValid=false;render()}
function point(e){const size=Math.min(w,h)*.44*zoom;return{x:(e.clientX-w/2-panX)/size,y:(e.clientY-h/2-panY)/size}}
function pathSegment(c,a,b,scale){c.beginPath();c.moveTo(a.x*scale,a.y*scale);c.lineTo(b.x*scale,b.y*scale);c.stroke()}
function tracePath(c,s,scale){
 const pts=s.points;if(!pts.length)return;const a=pts[0],b=pts[pts.length-1],type=s.tool||'free';
 c.beginPath();
 if(type==='circle'&&pts.length>1){const r=Math.hypot(b.x-a.x,b.y-a.y)*scale;c.arc(a.x*scale,a.y*scale,r,0,Math.PI*2);return}
 if(type==='arc'&&pts.length>1){const dx=b.x-a.x,dy=b.y-a.y,r=Math.hypot(dx,dy)*scale/2;if(r<.01)return;const cx=(a.x+b.x)*scale/2,cy=(a.y+b.y)*scale/2,ang=Math.atan2(dy,dx);c.arc(cx,cy,r,ang+Math.PI,ang,false);return}
 c.moveTo(a.x*scale,a.y*scale);
 if(type==='line'){c.lineTo(b.x*scale,b.y*scale);return}
 if(pts.length===1){c.lineTo(a.x*scale+.001,a.y*scale);return}
 // Quadratic midpoint interpolation reduces touch-input corners.
 for(let j=1;j<pts.length-1;j++){const p=pts[j],q=pts[j+1];c.quadraticCurveTo(p.x*scale,p.y*scale,(p.x+q.x)*scale/2,(p.y+q.y)*scale/2)}
 const last=pts[pts.length-1];c.lineTo(last.x*scale,last.y*scale);
}
function paintStroke(c,s,width,height,preview=false){if(!s.points.length)return;const scale=Math.min(width,height)*.44;c.save();c.translate(width/2,height/2);c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.brush*(Math.min(width,height)/390);if(s.style==='dream'){c.globalAlpha=.38;c.lineWidth*=2.3}c.lineCap='round';c.lineJoin='round';
 // Several translucent passes avoid expensive shadowBlur for each mirrored path.
 const baseWidth=c.lineWidth,glow=s.style==='glow';
 if(glow&&!preview){c.shadowColor=s.color;c.shadowBlur=Math.max(6,baseWidth*4);}
 for(let i=0;i<s.symmetry;i++){c.save();c.rotate(2*Math.PI*i/s.symmetry);for(const mirrored of [false,true]){c.save();if(mirrored)c.scale(1,-1);tracePath(c,s,scale);
 if(glow&&preview){c.globalAlpha=.12;c.lineWidth=baseWidth*3.5;c.stroke();c.globalAlpha=1;c.lineWidth=baseWidth;c.stroke()}
 else if(glow){c.globalAlpha=.8;c.lineWidth=baseWidth;c.stroke();c.shadowBlur=0;c.globalAlpha=1;c.stroke();c.shadowBlur=Math.max(6,baseWidth*4)}
 else c.stroke();
 c.restore()}c.restore()}c.restore()}
function paintCached(){layerCtx.setTransform(1,0,0,1,0,0);layerCtx.clearRect(0,0,layer.width,layer.height);layerCtx.setTransform(dpr,0,0,dpr,0,0);for(const s of strokes)paintStroke(layerCtx,s,w,h);cacheValid=true}
function drawGuides(){if(!showGuides)return;const n=Number(symmetry.value);const radius=Math.hypot(w,h)/Math.max(.25,zoom);ctx.save();ctx.translate(w/2+panX,h/2+panY);ctx.scale(zoom,zoom);ctx.strokeStyle='rgba(200,215,255,.19)';ctx.lineWidth=1/zoom;ctx.setLineDash([5/zoom,8/zoom]);for(let i=0;i<n;i++){const a=i*Math.PI*2/n;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*radius,Math.sin(a)*radius);ctx.stroke()}ctx.restore()}
function drawFrame(){framePending=false;if(!cacheValid)paintCached();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2+panX,h/2+panY);ctx.scale(zoom,zoom);ctx.translate(-w/2,-h/2);ctx.drawImage(layer,0,0,w,h);if(current)paintStroke(ctx,current,w,h,true);ctx.restore();drawGuides()}
function render(){if(!framePending){framePending=true;requestAnimationFrame(drawFrame)}const guide=document.getElementById('center-guide');guide.style.setProperty('--pan-x',panX+'px');guide.style.setProperty('--pan-y',panY+'px');guide.style.setProperty('--zoom',zoom);document.getElementById('zoom-label').textContent=Math.round(zoom*100)+'%'}
function persist(){try{localStorage.setItem(key,JSON.stringify(strokes))}catch(e){toast('Storage full. Export your artwork.')}}
function finish(){if(!current)return;const finished=current;strokes.push(finished);current=null;redo=[];if(cacheValid){layerCtx.setTransform(dpr,0,0,dpr,0,0);paintStroke(layerCtx,finished,w,h)}else{cacheValid=false}persist();buttons();render()}
canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);if(panMode){lastDrag={x:e.clientX,y:e.clientY};return}current={color:activeColor,brush:Number(brush.value),symmetry:Number(symmetry.value),style,tool,points:[point(e)]};render()});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer)return;e.preventDefault();if(lastDrag){panX+=e.clientX-lastDrag.x;panY+=e.clientY-lastDrag.y;lastDrag={x:e.clientX,y:e.clientY};render();return}if(!current)return;const p=point(e),last=current.points[current.points.length-1];if(tool!=='free'){current.points[1]=p;render()}else if(Math.hypot(p.x-last.x,p.y-last.y)>.004){current.points.push(p);render()}});
function endPointer(e){if(e.pointerId!==activePointer)return;activePointer=null;lastDrag=null;finish()}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);window.addEventListener('blur',()=>{activePointer=null;lastDrag=null;finish()});
symmetry.addEventListener('input',()=>{count.textContent=symmetry.value;render()});
document.getElementById('guides').onclick=()=>{showGuides=!showGuides;const b=document.getElementById('guides');b.setAttribute('aria-pressed',String(showGuides));b.textContent=showGuides?'Guides ✓':'Guides ○';render()};
document.getElementById('toggle').onclick=()=>{const panel=document.getElementById('advanced');panel.hidden=!panel.hidden;document.getElementById('toggle').setAttribute('aria-expanded',String(!panel.hidden))};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('chosen',x===b));toast(b.textContent+' tool')});
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('chosen',x===b));toast(b.textContent+' brush')});
document.getElementById('pan').onclick=()=>{panMode=!panMode;document.getElementById('pan').classList.toggle('chosen',panMode);document.getElementById('pan').setAttribute('aria-pressed',String(panMode));toast(panMode?'Drag to move artwork':'Drawing mode')};
document.getElementById('plus').onclick=()=>{zoom=Math.min(4,Math.round((zoom+.25)*100)/100);render()};
document.getElementById('minus').onclick=()=>{zoom=Math.max(.25,Math.round((zoom-.25)*100)/100);render()};
document.getElementById('fit').onclick=()=>{zoom=1;panX=0;panY=0;render()};

document.getElementById('undo').onclick=()=>{if(strokes.length){redo.push(strokes.pop());cacheValid=false;persist();render();buttons()}};
document.getElementById('redo').onclick=()=>{if(redo.length){strokes.push(redo.pop());cacheValid=false;persist();render();buttons()}};
document.getElementById('clear').onclick=()=>{if(!strokes.length)return;if(!confirm('Clear your drawing?'))return;strokes=[];redo=[];current=null;cacheValid=false;persist();render();buttons();toast('Canvas cleared')};
document.getElementById('save').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=2048;const c=out.getContext('2d');c.fillStyle='#0d1020';c.fillRect(0,0,2048,2048);for(const stroke of strokes)paintStroke(c,stroke,2048,2048);if(current)paintStroke(c,current,2048,2048);const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='bloomloop-'+new Date().toISOString().slice(0,10)+'.png';a.click();toast('Artwork exported')};
const palette=document.getElementById('palette');colors.forEach(color=>{const b=document.createElement('button');b.className='dot';b.style.background=color;b.type='button';b.setAttribute('aria-label','Select '+color);b.onclick=()=>{activeColor=color;palette.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};palette.appendChild(b)});palette.firstChild.classList.add('selected');
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))strokes=saved.filter(s=>s&&Array.isArray(s.points)&&Number.isInteger(s.symmetry)&&s.symmetry>=2&&s.symmetry<=48&&typeof s.color==='string'&&Number.isFinite(s.brush)).slice(-300)}catch(e){toast('Previous sketch could not be loaded')}
window.addEventListener('resize',resize);resize();buttons();
})();
</script>
</body>
</html>
